<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc">
<title id="title">Smart Zoo Navigator</title><desc id="desc">Decorative map illustration with a dotted route connecting three locations.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:3px}.title{font-size:29px;font-weight:700;fill:#f8fafc}.caption{font-size:16px;fill:#cbd5e1}.chip{font-size:11px;font-weight:700;letter-spacing:1px}</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d3238"/><stop offset="1" stop-color="#10223a"/></linearGradient><linearGradient id="route"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<rect x="1" y="1" width="598" height="308" rx="20" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity=".4"/>
<circle cx="519" cy="48" r="114" fill="#14b8a6" opacity=".08"/>
