<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">Sidharth Sharma</title>
  <desc id="description">Building useful things for the web. A navy, cyan and violet profile banner for a BCA student at PSIT, Kanpur, graduating in 2028.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11112b"/>
      <stop offset=".55" stop-color="#12243b"/><stop offset="1" stop-color="#271448"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="cyan"><stop stop-color="#06b6d4" stop-opacity=".25"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow">
      <stop stop-color="#6366f1" stop-opacity=".60"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="24" fill="url(#background)" stroke="#26334c"/>
  <rect x="1" y="1" width="1278" height="398" rx="24" fill="url(#grid)"/>
  <ellipse cx="370" cy="50" rx="480" ry="340" fill="url(#cyan)"/>
  <ellipse cx="1020" cy="200" rx="300" ry="240" fill="url(#glow)"/>
  <path d="M 24 2 H 1256" stroke="url(#accent)" stroke-width="3" opacity=".8"/>
  <rect x="56" y="54" width="28" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="97" y="61" fill="#a5b4cb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">URFAVSIDHU / BUILDER IN PROGRESS</text>
  <text x="54" y="166" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Sidharth Sharma<tspan fill="#67e8f9">.</tspan></text>
  <text x="57" y="209" fill="#b8c6db" font-family="Arial, Helvetica, sans-serif" font-size="24">Building useful things for the web.</text>
  <rect x="57" y="240" width="122" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="57" y="291" fill="#a5b4cb" font-family="Arial, Helvetica, sans-serif" font-size="16">BCA @ PSIT, Kanpur <tspan fill="#536680"> / </tspan> Class of 2028</text>
  <text x="57" y="339" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">BUILD. LEARN. REPEAT.</text>
  <g transform="translate(844 66)">
    <rect width="380" height="268" rx="16" fill="#0b1222" stroke="#2c3b56"/>
    <path d="M 0 43 H 380" stroke="#2c3b56"/>
    <circle cx="23" cy="22" r="4" fill="#fb7185"/>
    <circle cx="38" cy="22" r="4" fill="#fbbf24"/>
    <circle cx="53" cy="22" r="4" fill="#34d399"/>
    <text x="285" y="26" fill="#7486a3" font-family="Arial, Helvetica, sans-serif" font-size="11">mindset.js</text>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="17">
      <text x="25" y="88" fill="#a78bfa">const <tspan fill="#e2e8f0">journey = {</tspan></text>
      <text x="43" y="124" fill="#93c5fd">  curiosity: <tspan fill="#67e8f9">true</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="43" y="160" fill="#93c5fd">  progress: <tspan fill="#fcd34d">"daily"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="43" y="196" fill="#93c5fd">  next: <tspan fill="#fcd34d">"keep building"</tspan></text>
      <text x="25" y="232" fill="#e2e8f0">};</text>
    </g>
  </g>
</svg>
